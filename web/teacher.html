<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#163a85">
<meta name="robots" content="noindex">
<title>Polski Box · Profesora</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
  body{user-select:text;-webkit-user-select:text}
  .tw{max-width:1180px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 40px}
  .tgrid{display:grid;gap:16px}
  @media (min-width:900px){.tgrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
  label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:12px 0 5px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  textarea.field{font-family:inherit;font-size:16px;min-height:64px}
  .pl-in{font-size:22px;font-weight:700}
  .emopick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .emopick button{width:42px;height:42px;border-radius:10px;background:var(--sky);font-size:24px}
  .emopick button.on{outline:3px solid var(--co)}
  .emoin{width:72px;text-align:center;font-size:28px}
  .issue{border-radius:14px;padding:10px 12px;margin-top:8px;background:var(--ambb)}
  .issue.ok{background:var(--okb)}.issue.bad{background:var(--badb)}
  .pic.photo{overflow:hidden;padding:0}.pic.photo img{width:100%;height:100%;object-fit:cover}
  .issue b{display:block}.issue .ctx{font-size:14px;color:var(--mute);margin:3px 0}.issue mark{background:var(--amb);color:#fff;border-radius:4px;padding:0 3px}
  .sug{display:inline-block;margin:4px 6px 0 0;padding:5px 10px;border-radius:9px;background:var(--card);color:var(--co);font-weight:700;box-shadow:var(--sh)}
  .ai{border:2px solid var(--co)}
  .kv b{font-weight:700}
  .seg.r button{padding:8px 14px}
  .lst .wrow small{display:block;color:var(--mute);font-size:12px}
  .hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hdr h1{margin:0;font-size:20px;flex:1}
  .top .seg button{color:#cfd9f5}.top .seg button.on{color:var(--co)}
  .top .seg{background:rgba(255,255,255,.14)}
  .lt{font-size:12px;color:var(--mute);margin-top:16px}
  .lt a{color:var(--co)}
  .tabs button{flex:1;padding:10px 12px}
  .lvl{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.lvl i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
  .rbtns{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}.rbtns .btn{min-height:56px}
  .recb{font-size:19px}.recc{border:2px solid var(--co)}
  .vlist{max-height:62vh;overflow-y:auto}.vlist .wrow.sel{background:var(--sky);border-radius:12px;padding-left:8px}
  @media (max-width:560px){.rbtns{grid-template-columns:1fr 1fr}.rbtns .recb{grid-column:1/3}}
  @media (hover:none){.kbh{display:none}}
  .whead{display:flex;gap:14px;align-items:center;margin-top:10px}.whead .pic.md{flex:none}
  h3.sec{font-size:15px;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
  .filebtn{display:flex;align-items:center;justify-content:center;cursor:pointer}
  .phrow{display:flex;gap:12px;align-items:center}.thumb{width:84px;height:84px;object-fit:cover;border-radius:14px}
  .bdg{font-size:15px;white-space:nowrap}.wrow.dim b{text-decoration:line-through;opacity:.6}
  .hidc{border-color:var(--amb)}
  .linkbtn{background:none;border:0;color:var(--co);font-weight:700;cursor:pointer;padding:0;font-size:12px}
</style>
</head><body>
<div class="top"><h1>Polski Box<small id="ttl">Profesora</small></h1><div class="seg" id="lang"><button data-l="pl">PL</button><button data-l="es">ES</button></div></div>
<div class="tw" id="tw"></div>
<script src="data.js"></script><script src="ipa.js"></script><script src="vendor/lame.min.js"></script><script src="recorder.js"></script><script src="teacher.js"></script>
</body></html>
