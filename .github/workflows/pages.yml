name: Publicar web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIPER_VOICE: pl_PL-gosia-medium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache voice model and rendered audio
        uses: actions/cache@v4
        with:
          path: |
            .voices
            .hd
          key: piper-${{ env.PIPER_VOICE }}-${{ hashFiles('web/audio.json', 'tools/piper_audio.py') }}
          restore-keys: piper-${{ env.PIPER_VOICE }}-

      # Neural voice for all recordings. If anything fails here the site still publishes with the eSpeak recordings.
      - name: Render HD audio with Piper
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q piper-tts==1.8.0
          test -f .voices/$PIPER_VOICE.onnx || python3 -m piper.download_voices $PIPER_VOICE --data-dir .voices
          python3 tools/piper_audio.py

      - name: Stamp offline cache version
        run: sed -i "s/pb-dev/pb-${GITHUB_SHA::8}/" web/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
